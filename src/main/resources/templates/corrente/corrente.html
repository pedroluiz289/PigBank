<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/corrente/dashboard.css}">
    <link rel="shortcut icon" th:href="@{/images/favicon.ico}" type="image/x-icon">
    <script th:src="@{/js/corrente/dashboard.js}" defer></script>
    <title>PigBank - Conta Corrente</title>
</head>
<body>
    <main id="main-container">
        <header id="cabecalho">
            <div id="usuario-informacoes">
                <div id="avatar">
                    <span id="avatar-icone" class="material-symbols-outlined">person</span>
                </div>
                <div id="usuario-texto">
                    <p id="saudacoes">Olá,</p>
                    <p th:text="${usuario.nome}" id="usuario-nome">Nome</p>
                </div>
            </div>
            <div id="usuario-acoes">
                <a class="acoes-botao" th:href="@{/corrente/editar}">
                    <span class="material-symbols-outlined">edit</span>
                </a>
                <a class="acoes-botao" th:href="@{/sair}">
                    <span class="material-symbols-outlined">logout</span>
                </a>
            </div>
        </header>
        <section id="dashboard">
            <section id="saldo-container">
                <div id="saldo-cabecalho">
                    <p id="saldo-titulo">Saldo disponível</p>
                    <button id="botao-mostrar-saldo" th:data-saldo="${usuario.saldo}" onclick="mostrarSaldo(this)">
                        <span id="mostrar-saldo-icone" class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
                <div id="saldo-valor-container">
                    <span>R$</span>
                    <p th:text="${#numbers.formatDecimal(usuario.saldo, 1, 2)}" id="saldo-valor">0.00</p>
                </div>
                <div id="saldo-linha"></div>
                <div id="saldo-detalhes">
                    <div class="detalhes-item">
                        <p class="detalhes-titulo">Limite Disponivel</p>
                        <strong th:text="'R$ ' + ${#numbers.formatDecimal(usuario.getLimiteDisponivel, 1, 2)}">R$ 0.00</strong>
                    </div>
                </div>
            </section>
            <section id="acoes-rapidas">
                <a class="item-acao" th:href="@{/corrente/deposito}">
                    <div class="item-icone">
                        <span class="material-symbols-outlined">account_balance</span>
                    </div>
                    <p>Deposito</p>
                </a>
                <a class="item-acao" th:href="@{/corrente/saque}">
                    <div class="item-icone">
                        <span class="material-symbols-outlined">payment_arrow_down</span>
                    </div>
                    <p>Saque</p>
                </a>
                <a class="item-acao" th:href="@{/corrente/extrato}">
                    <div class="item-icone">
                        <span class="material-symbols-outlined">receipt_long</span>
                    </div>
                    <p>Extrato</p>
                </a>
            </section>
            <section id="extrato">
                <div id="extrato-header">
                    <h3 id="extrato-titulo">Últimas Movimentações</h3>
                    <a id="extrato-link" href="">Ver extrato completo</a>
                </div>
                <th:block th:if="${!#lists.isEmpty(usuario.transacao)}">
                    <div id="lista-transacoes">
                        <div class="trasacao" th:each="t, quantidade: ${usuario.transacao}" th:if="${quantidade.count < 5}">
                            <div class="informacoes-transacao">
                                <div class="icone-trasacao">
                                    <span class="material-symbols-outlined">person</span>
                                </div>
                                <div class="detalhes-transacao">
                                    <h4 th:text="${t.tipo}">Placeholder</h4>
                                    <p th:text="${t.data}">00-00-00 00:00:00</p>
                                </div>
                            </div>
                            <strong th:text="${#numbers.formatDecimal(t.valor, 1, 2)}"></strong>
                        </div>
                    </div>
                </th:block>
                <th:block th:unless="${!#lists.isEmpty(usuario.transacao)}">
                    <p>Placeholder</p>
                </th:block>
            </section>
        </section>
    </main>
</body>
</html>
