<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/images/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/corrente/editar.css}">
    <title>PigBank - Editar Perfil</title>
</head>
<body class="body-container">
    <main class="main-container">
        <header>
            <div class="header-topo">
                <a class="botao-voltar" th:href="@{/corrente/dashboard}">
                    <span id="icone-voltar" class="material-symbols-outlined">arrow_back_ios</span>
                    <span>Voltar</span>
                </a>
                <h1 class="header-titulo">Editar Perfil</h1>
            </div>
        </header>
        <form th:action="@{/corrente/salvar}" method="post" th:object="${usuario}">
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome-input" th:field="*{nome}">
    
            <button type="submit">Atualizar</button>
        </form>
    </main>
</body>
</html>
