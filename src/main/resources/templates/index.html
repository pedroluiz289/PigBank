<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/desktop/style.css}">
    <link rel="stylesheet" th:href="@{/css/mobile/style.css}">
    <link rel="shortcut icon" th:href="@{/images/favicon-conta-corrente.ico}" type="image/x-icon">
    <title>PigBank - Bem vindo</title>
</head>
<body>
    <main id="fundo-index">
        <section id="container-index">
            <span id="icone-index" class="material-symbols-outlined">savings</span>
            <h1 id="titulo-index">PigBank</h1>
            <p id="subtitulo-index">Selecione o tipo de conta para acessar</p>
            <div id="botoes-container">
                <form th:action="@{/entrar-corrente}" method="post">
                    <button type="submit" class="botao">
                        <div class="botao-conteudo">
                            <span class="material-symbols-outlined">credit_card</span>
                            <span>Conta Corrente</span>
                        </div>
                        <span class="material-symbols-outlined setas">arrow_forward_ios</span>
                    </button>
                </form>
                <form th:action="@{/entrar-poupanca}" method="post">
                    <button id="botao-conta-poupanca" type="submit" class="botao">
                        <div class="botao-conteudo">
                            <span class="material-symbols-outlined">savings</span>
                            <span>Conta Poupança</span>
                        </div>
                        <span class="material-symbols-outlined setas">arrow_forward_ios</span>
                    </button>
                </form>
            </div>
            <div id="aviso">
                <p>Este projeto é uma <strong>demonstração</strong>. Todos os dados apresentados são totalmente <strong>fictícios</strong> e não possuem <strong>valor financeiro real</strong>.</p>
            </div>
        </section>
    </main>
</body>
</html>
