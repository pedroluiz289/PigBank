<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/corrente/extrato.css}">
    <link rel="shortcut icon" th:href="@{/images/favicon.ico}" type="image/x-icon">
    <script th:src="@{/js/corrente/extrato.js}" defer></script>
    <title>PigBank - Extrato</title>
</head>
<body class="body-container">
    <main class="main-container">
        <header>
            <div class="header-topo">
                <a class="botao-voltar" th:href="@{/corrente/dashboard}">
                    <span id="icone-voltar" class="material-symbols-outlined">arrow_back_ios</span>
                    <span>Voltar</span>
                </a>
                <h1 class="header-titulo">Extrato da Conta</h1>
                <button type="button">
                    <span class="material-symbols-outlined">download</span>
                    <span>Exportar</span>
                </button>
            </div>
        </header>
        <section id="resumo-financas">
            <div class="card-resumo">
                <p>Entradas</p>
                <strong th:text="'+ R$ ' + ${#numbers.formatDecimal(usuario.entradas, 1, 2)}">R$ 0,00</strong>
            </div>
            <div class="card-resumo">
                <p>Saídas</p>
                <strong th:text="'- R$ ' + ${#numbers.formatDecimal(usuario.saidas, 1, 2)}">R$ 0,00</strong>
            </div>
            <div class="card-resumo">
                <p>Saldo Atual</p>
                <strong th:text="'R$ ' + ${#numbers.formatDecimal(usuario.saldo, 1, 2)}">R$ 0,00</strong>
            </div>
        </section>
        <section id="filtro-busca">
            <div id="container-busca">
                <span class="material-symbols-outlined">search</span>
                <input type="text" id="campo-busca" placeholder="Buscar pelo tipo" onkeyup="filtrarTransacoes()">
            </div>
            <div id="tags-filtro">
                <button class="tag" onclick="aplicarFiltro('todos')">Todos</button>
                <button class="tag" onclick="aplicarFiltro('deposito')">Entradas</button>
                <button class="tag" onclick="aplicarFiltro('saque')">Saídas</button>
            </div>
        </section>
        <section id="lista-transacoes">
            <th:block th:if="${!#lists.isEmpty(usuario.transacao)}">
                <div class="trasacao" th:each="t, quantidade: ${usuario.transacao}" th:if="${quantidade.count < 6}"
                    th:classappend="${quantidade.count == 5 or quantidade.last} ? '' : 'transacao-linha'">
                    <div class="informacoes-transacao">
                        <div class="icone-trasacao">
                            <span th:text="${t.tipo == 'Deposito'} ? 'account_balance' : 'payment_arrow_down'"
                                class="material-symbols-outlined">person</span>
                        </div>
                        <div class="detalhes-transacao">
                            <h4 th:text="${t.tipo}">Placeholder</h4>
                            <p th:text="${@dateUtils.tempoRelativo(t.data)}">00-00-00 00:00:00</p>
                        </div>
                    </div>
                    <strong th:classappend="${t.tipo == 'Deposito'} ? 'valor-deposito' : 'valor-saque'"
                        th:text="${t.tipo == 'Deposito'} ? '+ R$ ' + ${#numbers.formatDecimal(t.valor, 1, 2)} : '- R$ ' + ${#numbers.formatDecimal(t.valor, 1, 2)}"></strong>
                </div>
            </th:block>
            <th:block th:unless="${!#lists.isEmpty(usuario.transacao)}">
                <div id="transacao-vazia">
                    <div id="transacao-vazia-icone">
                        <span class="material-symbols-outlined">receipt</span>
                    </div>
                    <h3 id="transacao-vazia-titulo">Nenhuma movimentação ainda</h3>
                    <p id="transacao-vazia-texto">Você ainda não realizou transações nesta conta.</p>
                </div>
            </th:block>
        </section>
    </main>
</body>
</html>
