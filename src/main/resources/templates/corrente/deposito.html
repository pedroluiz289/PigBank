<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/corrente/deposito.css}">
    <link rel="shortcut icon" th:href="@{/images/favicon.ico}" type="image/x-icon">
    <script th:src="@{/js/corrente/deposito.js}" defer></script>
    <title>PigBank - Deposito</title>
</head>
<body class="body-container">
    <main class="main-container">
        <header>
            <div class="header-topo">
                <a class="botao-voltar" th:href="@{/corrente/dashboard}">
                    <span id="icone-voltar" class="material-symbols-outlined">arrow_back_ios</span>
                    <span>Voltar</span>
                </a>
                <h1 class="header-titulo">Depósito</h1>
                <div style="width: 80px;"></div>
            </div>
            <div class="header-saldo">
                <div>
                    <p id="header-saldo-titulo">Saldo Atual</p>
                    <strong id="saldo-valor" th:text="'R$ ' + ${#numbers.formatDecimal(usuario.saldo, 1, 2)}" class="header-valor">0.00</strong>
                </div>
                <button id="botao-mostrar-saldo" th:data-saldo="${usuario.saldo}" type="button">
                    <span id="mostrar-saldo-icone" class="material-symbols-outlined">visibility</span>
                    <span id="texto-icone">Ocultar</span>
                </button>
            </div>
        </header>
        <section class="card">
            <form th:action="@{/corrente/salvardeposito}" method="post" th:object="${usuario}">
                <div id="campo-saldo">
                    <label for="saldo">Valor do Depósito</label>
                    <div class="saldo-wrapper">
                        <span class="simbolo-saldo">R$</span>
                        <input type="text" name="saldo" id="saldo" class="saldo-input" placeholder="0,00" required>
                    </div>
                </div>
                <div id="valores-rapidos">
                    <button class="botao-rapido" type="button" onclick="adicionarValor(5)">+ R$ 5</button>
                    <button class="botao-rapido" type="button" onclick="adicionarValor(10)">+ R$ 10</button>
                    <button class="botao-rapido" type="button" onclick="adicionarValor(20)">+ R$ 20</button>
                    <button class="botao-rapido" type="button" onclick="adicionarValor(50)">+ R$ 50</button>
                    <button class="botao-rapido" type="button" onclick="adicionarValor(100)">+ R$ 100</button>
                    <button class="botao-rapido" type="button" onclick="adicionarValor(200)">+ R$ 200</button>
                </div>
                <div id="botoes-container">
                    <button type="reset" id="botao-limpar">
                        <span class="material-symbols-outlined">refresh</span>
                        <span>Limpar</span>
                    </button>
                    <button type="submit" id="botao-deposito">
                        <span class="material-symbols-outlined">attach_money</span>
                        <span>Confirmar Depósito</span>
                    </button>
                </div>
            </form>
        </section>
        <th:block th:if="${sucesso}">
            <dialog id="notificacao" class="notificacao-sucesso">
                <span id="icone-notificacao" class="material-symbols-outlined icone-notificacao-sucesso">check</span>
                <p>O deposito foi realizado com sucesso!</p>
            </dialog>
        </th:block>
        <th:block th:if="${erro}">
            <dialog id="notificacao" class="notificacao-erro">
                <span id="icone-notificacao" class="material-symbols-outlined icone-notificacao-erro">close</span>
                <p>O valor do deposito não pode ser igual a <strong>R$0,00</strong></p>
            </dialog>
        </th:block>
    </main>
</body>
</html>
