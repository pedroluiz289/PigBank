<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/corrente/editar.css}">
    <link rel="shortcut icon" th:href="@{/images/favicon.ico}" type="image/x-icon">
    <script th:src="@{/js/corrente/deposito.js}" defer></script>
    <title>PigBank - Sacar</title>
</head>
<body class="body-container">
    <main class="main-container">
        <header>
            <div class="header-topo">
                <a class="botao-voltar" th:href="@{/corrente/dashboard}">
                    <span id="icone-voltar" class="material-symbols-outlined">arrow_back_ios</span>
                    <span>Voltar</span>
                </a>
                <h1 class="header-titulo">Sacar</h1>
            </div>
            <div class="header-saldo">
                <p id="header-saldo-titulo">Saldo atual</p>
                <strong th:text="'R$ ' + ${#numbers.formatDecimal(usuario.saldo, 1, 2)}" id="header-valor">R$ 0.00</strong>
            </div>
        </header>
        <section class="card">
            <form th:action="@{/corrente/salvardeposito}" method="post" th:object="${usuario}">
                <div>
                    <label for="saldo">Informe o valor do depósito</label>
                    <div>
                        <span>R$</span>
                        <input type="text" name="saldo" id="saldo" placeholder="0,00" required>
                    </div>
                </div>
                <div id="valores-rapidos">
                    <button class="botao-rapido" type="button" onclick="adicionarValor(5)">R$ 5 +</button>
                    <button class="botao-rapido" type="button" onclick="adicionarValor(10)">R$ 10 +</button>
                    <button class="botao-rapido" type="button" onclick="adicionarValor(20)">R$ 20 +</button>
                    <button class="botao-rapido" type="button" onclick="adicionarValor(50)">R$ 50 +</button>
                    <button class="botao-rapido" type="button" onclick="adicionarValor(100)">R$ 100 +</button>
                </div>
                <button type="reset">Limpar</button>
                <button type="submit">Confirmar Depósito</button>
            </form>
        </section>
    </main>
</body>
</html>
