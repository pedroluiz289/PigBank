<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/images/favicon-conta-corrente.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/desktop/corrente/editar.css}">
    <link rel="stylesheet" th:href="@{/css/mobile/corrente/editar.css}">
    <script th:src="@{/js/corrente/editarperfil.js}" defer></script>
    <title>PigBank - Editar Perfil</title>
</head>
<body class="body-container">
    <main class="main-container">
        <header>
            <div class="header-topo">
                <a class="botao-voltar" th:href="@{/corrente}">
                    <span id="icone-voltar" class="material-symbols-outlined">arrow_back_ios</span>
                    <span>Voltar</span>
                </a>
                <h1 class="header-titulo">Editar Perfil</h1>
                <div style="width: 80px;"></div>
            </div>
        </header>
        <form id="card-principal" method="post">
            <div id="grid-elementos">
                <div class="elemento">
                    <label class="nome-elemento" for="nome">Nome Completo</label>
                    <div class="container-input">
                        <span class="material-symbols-outlined icone-elemento">person</span>
                        <input class="input-elemento" type="text" name="nome" id="nome-input" th:value="${usuario.nome}">
                    </div>
                </div>
                <div class="elemento">
                    <label class="nome-elemento" for="agencia">Agência e Conta</label>
                    <div class="container-input">
                        <span class="material-symbols-outlined icone-elemento">account_balance</span>
                        <input class="input-elemento" type="text" name="agencia" id="nome-input" th:value="${'Agencia: ' + #numbers.formatInteger(usuario.agencia, 4) + ' Conta: ' + usuario.conta}" disabled>
                    </div>
                </div>
            </div>
            <div id="botao-container">
                <button id="botao-salvar" type="submit">Salvar Alterações</button>
            </div>
        </form>
        <dialog id="notificacao">
            <span id="icone-notificacao" class="material-symbols-outlined">check</span>
            <p id="texto-notificacao"></p>
        </dialog>
    </main>
</body>
</html>
